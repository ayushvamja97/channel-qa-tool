name: Validate application and CNN service
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: synthetic-ci-password
          MYSQL_DATABASE: channel_qa_tool_test
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -psynthetic-ci-password"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: mysql://root:synthetic-ci-password@127.0.0.1:3307/channel_qa_tool_test
      ALLOW_TEST_DATABASE: 'true'
      JWT_SECRET: synthetic-ci-secret-only-not-for-deployment
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
  cnn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: vision/requirements*.txt
      - run: pip install torch==2.7.0 torchvision==0.22.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r vision/requirements-dev.txt
      - run: python -m unittest -v test_app.py
        working-directory: vision
  docker-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MYSQL_ROOT_PASSWORD: synthetic-compose-db-password
      JWT_SECRET: synthetic-compose-jwt-secret-at-least-32-characters
      SEED_ADMIN_PASSWORD: synthetic-compose-admin-password
      SEED_USER_PASSWORD: synthetic-compose-user-password
      SEED_DEMO_DATA: 'true'
      AI_ENABLED: 'false'
      VISION_SERVICE_TOKEN: synthetic-compose-vision-service-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: docker compose -f docker-compose.yml -f docker-compose.ai.yml up --build -d
      - run: node scripts/docker-smoke.mjs
      - name: Container logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ai.yml logs --no-color
      - name: Remove disposable containers and volumes
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ai.yml down -v
